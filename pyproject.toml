[tool.poetry]
name = "whisper-server"
version = "0.1.0"
description = ""
authors = ["N <47500890+avi-cenna@users.noreply.github.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11"
faster-whisper = "^1.0.2"
loguru = "^0.7.2"
sounddevice = "^0.4.6"
webrtcvad = "^2.0.10"
pyzmq = "^26.0.3"
black = "^24.4.2"
isort = "^5.12.0"
pydantic = "^2.5.2"
pyyaml = "^6.0.1"
openai = "^1.13.3"
typer = "^0.12.3"
fastapi = "^0.111.0"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
lines_between_types = 1

[mypy]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
whisper-server = "main:app"